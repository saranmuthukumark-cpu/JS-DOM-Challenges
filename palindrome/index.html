<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palindrome Finder</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-2xl text-center">
      <h1 class="text-4xl font-bold text-blue-600 mb-6">Palindrome Finder</h1>

      <input
        type="text"
        id="textInput"
        placeholder="Enter a word"
        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2" />

      <button
        onclick="checkPalindrome()"
        class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg transition">
        Check
      </button>

      <p id="result" class="mt-5 text-lg font-semibold"></p>
    </div>

    <script>
      function checkPalindrome() {
        const text = document.getElementById("textInput").value;
        const cleanText = text.toLowerCase();
        const reversedText = cleanText.split("").reverse().join("");

        const result = document.getElementById("result");

        if (cleanText === reversedText && text !== "") {
          result.innerHTML = `"${text}" is a Palindrome `;
          result.className = "mt-5 text-lg font-semibold text-green-600";
        } else {
          result.innerHTML = `"${text}" is NOT a Palindrome `;
          result.className = "mt-5 text-lg font-semibold text-red-600";
        }
      }
    </script>
  </body>
</html>
