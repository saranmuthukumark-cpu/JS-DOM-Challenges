<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Sign Up</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-96">
      <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">
        Sign Up here!
      </h1>

      <form id="signupForm" class="space-y-4">
        <div>
          <label class="block mb-1 font-medium">Full Name</label>
          <input
            type="text"
            id="name"
            placeholder="Enter your name"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none" />
        </div>

        <div>
          <label class="block mb-1 font-medium">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none" />
        </div>

        <div>
          <label class="block mb-1 font-medium">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter password"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none" />
        </div>

        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg transition">
          Create Account
        </button>
      </form>

      <p id="message" class="text-center mt-4 font-semibold"></p>
    </div>

    <script>
      const form = document.getElementById("signupForm");
      const message = document.getElementById("message");

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (name === "" || email === "" || password === "") {
          message.innerHTML = "Please fill all fields ";
          message.className = "text-center mt-4 font-semibold text-red-600";
        } else {
          message.innerHTML = "Signup Successful ";
          message.className = "text-center mt-4 font-semibold text-green-600";

          form.reset();
        }
      });
    </script>
  </body>
</html>
